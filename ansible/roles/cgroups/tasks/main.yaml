---
- name: Read current kernel cmdline
  ansible.builtin.slurp:
    src: /boot/firmware/cmdline.txt
  register: cgroups_cmdline_raw

- name: Decode cmdline
  ansible.builtin.set_fact:
    cgroups_cmdline: "{{ cgroups_cmdline_raw.content | b64decode }}"

- name: Check if required cgroup flags are present
  ansible.builtin.set_fact:
    cgroups_enabled: "{{ cgroups_cmdline is search('cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1 swapaccount=1') }}"

- name: Backup cmdline before modification
  become: true
  when: not cgroups_enabled
  ansible.builtin.copy:
    remote_src: true
    src: /boot/firmware/cmdline.txt
    dest: /boot/firmware/cmdline.txt.bak
    mode: "0644"

- name: Add required cgroup flags to cmdline
  become: true
  when: not cgroups_enabled
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: true
    regexp: "(.*)"
    line: "\\1 cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1 swapaccount=1"

- name: Reboot if cgroup flags changed
  become: true
  when: not cgroups_enabled
  ansible.builtin.reboot:

- name: Waiting for server to come back
  ansible.builtin.wait_for_connection:
