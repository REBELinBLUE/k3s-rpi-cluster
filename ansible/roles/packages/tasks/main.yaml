---
- name: Check if snapd is installed
  ansible.builtin.command: snap list
  register: snap_list
  changed_when: false
  failed_when: false

- name: Remove snapd
  become: true
  ansible.builtin.command: snap remove snapd
  when: snap_list.rc == 0

- name: Purge snapd package
  become: true
  ansible.builtin.apt:
    name: snapd
    state: absent
    purge: true
    autoremove: true

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  become: true
  ansible.builtin.apt:
    upgrade: true
    autoremove: true

- name: Install required packages
  become: true
  ansible.builtin.apt:
    name:
      - net-tools
      - libraspberrypi-bin
      - nfs-common
    state: present

- name: Install additional packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages_additional }}"
    state: present
