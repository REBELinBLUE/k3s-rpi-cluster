---
- name: Control Plane Configuration
  hosts: controlplane
  gather_facts: false

  roles:
    - role: cleanup
    - role: config
      vars:
        config_master: true
    - role: packages
      vars:
        packages_additional:
          - isc-dhcp-server
          - iptables
    - role: master
    - role: hosts
    - role: cgroups
    - role: shell
    - role: topgrade
    - role: starship
