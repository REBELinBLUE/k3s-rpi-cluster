apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: argocd
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  targetNamespace: argocd
  valuesContent: |-
    global:
      domain: argocd.cluster.rebelinblue.com
      logging:
        format: json
        level: warn
    configs:
      params:
        # Disable internal redirect to 443 as HTTPS is handled by the ingress controller and cert-manager
        # See https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#traefik-v30
        server.insecure: true
    server:
      service:
        annotations:
          - external-dns.kubernetes.io/hostname=argocd.cluster.rebelinblue.com.
      metrics:
        enabled: false
        serviceMonitor:
          enabled: true
    notifications:
      enabled: true
      notifiers:
        service.slack: |
          token: $slack-token
      secret:
        create: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.cluster.rebelinblue.com`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.cluster.rebelinblue.com`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls:
    secretName: argocd-server-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server
  namespace: argocd
spec:
  secretName: argocd-server-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - argocd.cluster.rebelinblue.com
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  destination:
    namespace: argocd
    name: in-cluster

  source:
    path: manifests/infrastructure/apps
    repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
    targetRevision: argo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
