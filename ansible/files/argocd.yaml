apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: argocd
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  targetNamespace: argocd
  version: 10.8.1
  valuesContent: |-
    global:
      domain: argocd.cluster.rebelinblue.com

      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
      - effect: NoSchedule
        key: node.kubernetes.io/unschedulable

    configs:
      params:
        # Disable internal redirect to 443 as HTTPS is handled by the ingress controller and cert-manager
        # See https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#traefik-v30
        server.insecure: true

    dex:
      enabled: false

    redis:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1024Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    applicationSet:
      replicas: 0

    repoServer:
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
        limits:
          cpu: 750m
          memory: 512Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    notifications:
      enabled: false
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  destination:
    namespace: argocd
    name: in-cluster

  source:
    repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
    targetRevision: feature/argocd-apps-chart
    path: gitops/chart

    helm:
      parameters:
        - name: group
          value: bootstrap
        - name: global.repoURL
          value: $ARGOCD_APP_SOURCE_REPO_URL
        - name: global.targetRevision
          value: $ARGOCD_APP_SOURCE_TARGET_REVISION


        - name: vars.ARGOCD_APP_SOURCE_REPO_URL
          value: $ARGOCD_APP_SOURCE_REPO_URL
        - name: vars.ARGOCD_APP_SOURCE_TARGET_REVISION
          value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        - name: global.ARGOCD_SERVER
          value: $ARGOCD_SERVER
        - name: global.ARGOCD_AUTH_TOKEN
          value: $ARGOCD_AUTH_TOKEN
        - name: global.ARGOCD_OPTS
          value: $ARGOCD_OPTS
        - name: global.ARGOCD_CONFIG_DIR
          value: $ARGOCD_CONFIG_DIR
        - name: global.ARGOCD_SERVER_NAME
          value: $ARGOCD_SERVER_NAME
        - name: global.ARGOCD_REPO_SERVER_NAME
          value: $ARGOCD_REPO_SERVER_NAME
        - name: global.ARGOCD_APPLICATION_CONTROLLER_NAME
          value: $ARGOCD_APPLICATION_CONTROLLER_NAME
        - name: global.ARGOCD_REDIS_NAME
          value: $ARGOCD_REDIS_NAME
        - name: global.ARGOCD_REDIS_HAPROXY_NAME
          value: $ARGOCD_REDIS_HAPROXY_NAME
        - name: global.ARGOCD_REDIS_KEY_PREFIX
          value: $ARGOCD_REDIS_KEY_PREFIX
        - name: global.ARGOCD_GRPC_KEEP_ALIVE_MIN
          value: $ARGOCD_GRPC_KEEP_ALIVE_MIN
  

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
