apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: argocd
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  targetNamespace: argocd
  version: 10.6.3
  valuesContent: |-
    global:
      domain: argocd.cluster.rebelinblue.com

      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
      - effect: NoSchedule
        key: node.kubernetes.io/unschedulable

    configs:
      params:
        # Disable internal redirect to 443 as HTTPS is handled by the ingress controller and cert-manager
        # See https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#traefik-v30
        server.insecure: true

    dex:
      enabled: false

    redis:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    controller:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1024Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    applicationSet:
      replicas: 0

    repoServer:
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
        limits:
          cpu: 750m
          memory: 512Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    notifications:
      enabled: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/target: dmzjrebqnjm.d.firewalla.org
spec:
  entryPoints:
    - websecure
    - web
  routes:
    - kind: Rule
      match: Host(`argocd.cluster.rebelinblue.com`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.cluster.rebelinblue.com`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls:
    secretName: argocd-server-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server
  namespace: argocd
spec:
  secretName: argocd-server-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - argocd.cluster.rebelinblue.com
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  destination:
    namespace: argocd
    name: in-cluster

  source:
    path: manifests/bootstrap
    repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
    targetRevision: main

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
