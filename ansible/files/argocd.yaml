---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  destination:
    namespace: argocd
    name: in-cluster

  source:
    path: manifests/infrastructure/apps
    repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
    targetRevision: argo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
