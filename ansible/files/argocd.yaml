apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: argocd
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  targetNamespace: argocd
  valuesContent: |-
    global:
      domain: argocd.cluster.rebelinblue.com
      logging:
        format: json
        level: warn
    configs:
      params:
        # Disable internal redirect to 443 as HTTPS is handled by the ingress controller and cert-manager
        # See https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#traefik-v30
        server.insecure: true
    server:
      metrics:
        enabled: false
        serviceMonitor:
          enabled: true
    notifications:
      enabled: true
      notifiers:
        service.slack: |
          token: $slack-token
      secret:
        create: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    forecastle.stakater.com/expose: "true"
    forecastle.stakater.com/icon: https://longhorn.io/img/logos/longhorn-icon-white.png
    forecastle.stakater.com/appName: ArgoCD
    forecastle.stakater.com/group: Infrastructure
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.cluster.rebelinblue.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
  tls:
    - hosts:
        - argocd.cluster.rebelinblue.com
      secretName: argocd-server-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.cluster.rebelinblue.com`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls:
    secretName: argocd-server-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server
  namespace: argocd
spec:
  secretName: argocd-server-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - argocd.cluster.rebelinblue.com
