apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik
  namespace: traefik
spec:
  secretName: argocd-server-tls
  issuerRef:
    name: {{ include "cluster-apps.certManagerIssuer" (dict "appName" "traefik" "root" $) }}
    kind: ClusterIssuer
  dnsNames:
    - traefik.cluster.rebelinblue.com