{{- $appName := "debugger" -}}
{{- if and (eq .Values.group "apps") (eq (include "cluster-apps.enabled" (dict "appName" $appName "root" $)) "true") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $appName }}
  namespace: argocd
spec:
  project: default

  destination:
    namespace: kube-system
    name: in-cluster

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  sources:
    - path: {{ .Values.global.manifestsPath }}/{{ $appName }}/
      repoURL: {{ .Values.global.repoURL }}
      targetRevision: {{ .Values.global.targetRevision }}
{{- end }}
