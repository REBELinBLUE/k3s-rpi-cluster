{{- if and (eq .Values.group "apps") (eq (include "cluster-apps.enabled" (dict "appName" "forecastle" "root" $)) "true") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forecastle
  namespace: argocd
spec:
  project: default

  destination:
    namespace: forecastle
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

  sources:
    - chart: forecastle
      repoURL: https://stakater.github.io/stakater-charts/
      targetRevision: 2.1.1

      helm:
        releaseName: forecastle

        valuesObject:
          forecastle:
            config:
              title: Launch Pad
              customApps: {}
              namespaceSelector:
                any: true

            ingress:
              enabled: true
              annotations:
                kubernetes.io/tls-acme: "true"
                cert-manager.io/cluster-issuer: {{ include "cluster-apps.certManagerIssuer" (dict "appName" "forecastle" "root" $) }}
                traefik.ingress.kubernetes.io/router.middlewares: traefik-forward-auth@kubernetescrd
              className: traefik
              hosts:
              - host: launchpad.cluster.rebelinblue.com
                paths:
                - path: /
                  pathType: ImplementationSpecific
              tls:
              - hosts:
                - launchpad.cluster.rebelinblue.com
                secretName: forecastle-tls
{{- end }}
