{{- if eq .Values.group "bootstrap" }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    #argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "100"
    external-dns.alpha.kubernetes.io/target: {{ .Values.global.firewallaAddress }}
spec:
  entryPoints:
    - websecure
    - web
  routes:
    - kind: Rule
      match: Host(`argocd.cluster.rebelinblue.com`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.cluster.rebelinblue.com`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls:
    secretName: argocd-server-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    #argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "100"
spec:
  secretName: argocd-server-tls
  issuerRef:
    name: {{ include "cluster-apps.certManagerIssuer" (dict "appName" "argocd" "root" $) }}
    kind: ClusterIssuer
  dnsNames:
    - argocd.cluster.rebelinblue.com
---
apiVersion: v1
kind: Configmap
metadata:
  name: argocd-vars
  namespace: argocd
spec:
  ARGOCD_APP_SOURCE_REPO_URL: {{ .Values.vars.ARGOCD_APP_SOURCE_REPO_URL }}
  ARGOCD_APP_SOURCE_TARGET_REVISION: {{ .Values.vars.ARGOCD_APP_SOURCE_TARGET_REVISION }}
  ARGOCD_SERVER: {{ .Values.vars.ARGOCD_SERVER }}
  ARGOCD_AUTH_TOKEN: {{ .Values.vars.ARGOCD_AUTH_TOKEN }}
  ARGOCD_OPTS: {{ .Values.vars.ARGOCD_OPTS }}
  ARGOCD_CONFIG_DIR: {{ .Values.vars.ARGOCD_CONFIG_DIR }}
  ARGOCD_SERVER_NAME: {{ .Values.vars.ARGOCD_SERVER_NAME }}
  ARGOCD_REPO_SERVER_NAME: {{ .Values.vars.ARGOCD_REPO_SERVER_NAME }}
  ARGOCD_APPLICATION_CONTROLLER_NAME: {{ .Values.vars.ARGOCD_APPLICATION_CONTROLLER_NAME }}
  ARGOCD_REDIS_NAME: {{ .Values.vars.ARGOCD_REDIS_NAME }}
  ARGOCD_REDIS_HAPROXY_NAME: {{ .Values.vars.ARGOCD_REDIS_HAPROXY_NAME }}
  ARGOCD_REDIS_KEY_PREFIX: {{ .Values.vars.ARGOCD_REDIS_KEY_PREFIX }}
  ARGOCD_GRPC_KEEP_ALIVE_MIN: {{ .Values.vars.ARGOCD_GRPC_KEEP_ALIVE_MIN }}
{{- end }}
