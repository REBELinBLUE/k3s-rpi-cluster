{{- if eq .Values.group "bootstrap" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd

spec:
  project: default

  destination:
    namespace: argocd
    name: in-cluster

  source:
    path: gitops/chart
    repoURL: {{ .Values.global.repoURL }}
    targetRevision: {{ .Values.global.targetRevision }}
    helm:
      parameters:
        - name: group
          value: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
{{- if eq .Values.group "argocd" }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ .Values.global.firewallaAddress }}
spec:
  entryPoints:
    - websecure
    - web
  routes:
    - kind: Rule
      match: Host(`argocd.cluster.rebelinblue.com`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.cluster.rebelinblue.com`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls:
    secretName: argocd-server-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server
  namespace: argocd
spec:
  secretName: argocd-server-tls
  issuerRef:
    name: {{ include "cluster-apps.certManagerIssuer" (dict "appName" "argocd" "root" $) }}
    kind: ClusterIssuer
  dnsNames:
    - argocd.cluster.rebelinblue.com
{{- end }}
