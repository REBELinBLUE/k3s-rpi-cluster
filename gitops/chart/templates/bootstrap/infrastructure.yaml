{{- if eq .Values.group "bootstrap" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
spec:
  project: default

  destination:
    namespace: argocd
    name: in-cluster

  source:
    repoURL: {{ .Values.global.repoURL }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: gitops/chart

    helm:
      parameters:
        - name: group
          value: infrastructure
        - name: global.repoURL
          value: {{ .Values.global.repoURL }}
        - name: global.targetRevision
          value: {{ .Values.global.targetRevision }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
