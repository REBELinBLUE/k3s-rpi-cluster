{{- if eq .Values.group "bootstrap" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default

  destination:
    namespace: argocd
    name: in-cluster

  source:
    repoURL: {{ .Values.global.repoURL }}
    targetRevision: {{ .Values.global.targetRevision }}
    path: gitops/chart

    helm:
      valuesObject:
        group: apps

        global:
          repoURL: $ARGOCD_APP_SOURCE_REPO_URL
          targetRevision: $ARGOCD_APP_SOURCE_TARGET_REVISION

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
