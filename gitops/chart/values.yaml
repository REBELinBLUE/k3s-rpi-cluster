global:
  # repoURL/targetRevision are overridden at runtime by the bootstrap Application
  # (ansible/files/argocd.yaml) via $ARGOCD_APP_SOURCE_REPO_URL/$ARGOCD_APP_SOURCE_TARGET_REVISION.
  # These are only used for local `helm template`/`helm lint`.
  repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
  targetRevision: feature/argocd-apps-chart
  firewallaAddress: dmzjrebqnjm.d.firewalla.org
  certManagerIssuer: letsencrypt-staging

# Which set of templates to render: "infrastructure", "apps" or "bootstrap"
# Always passed in as a helm parameter by the calling Application.
group: ""

# Per-app enable/disable switch, keyed by Application metadata.name.
apps:
  cert-manager-webhook-linode:
    enabled: true
  cert-manager:
    enabled: true
  external-dns:
    enabled: true
  longhorn:
    enabled: true
  metrics-server:
    enabled: true
  sealed-secrets-controller:
    enabled: true
  traefik-forward-auth:
    enabled: true
  traefik:
    enabled: true
  victoria-metrics:
    enabled: true
  kubeview:
    enabled: true
  podinfo:
    enabled: true
  debugger:
    enabled: false
  local-path-provisioner:
    enabled: false

# Per-app overrides, e.g.:
# overrides:
#   kubernetes-dashboard:
#     certManagerIssuer: letsencrypt-prod
overrides: {}
