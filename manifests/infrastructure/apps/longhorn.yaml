apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default

  destination:
    namespace: longhorn
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io
      targetRevision: 1.12.1

      helm:
        releaseName: longhorn
        valuesObject:
          persistence:
            defaultClassReplicaCount: 2
            defaultDataLocality: "best-effort"

          preUpgradeChecker:
            jobEnabled: false

    - path: manifests/infrastructure/manifests/longhorn/
      repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
      targetRevision: main

