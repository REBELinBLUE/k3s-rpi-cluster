apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default

  destination:
    namespace: logging
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.48.0

    helm:
      releaseName: loki

      valuesObject:
        ingress: # fixme: enable this
          enabled: false

        monitoring:
          serviceMonitor:
            enabled: true

        # See https://grafana.com/docs/loki/next/setup/install/helm/install-monolithic/#single-replica
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: 2024-04-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          ingester:
            chunk_encoding: snappy
          tracing:
            enabled: true
          pattern_ingester:
            enabled: true
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true
          ruler:
            enable_api: true
            storage:
              type: local
          querier:
            # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
            max_concurrent: 4
          storage:
            type: filesystem
            persistence:
              storageClass: local-path
              enabled: true
              size: 10Gi
            bucketNames:
              chunks: "thisisafakebucket" # Helm chart is now mad when this isn't set
              ruler: "thisisafakebucket"
              admin: "thisisafakebucket"
          commonStorageConfig:
            type: filesystem

        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
          resources:
            limits:
              cpu: 4
              memory: 4Gi
            requests:
              cpu: 2
              memory: 2Gi
          extraEnv:
            # Keep a little bit lower than memory limits
            - name: GOMEMLIMIT
              value: 3750MiB

        chunksCache:
          # default is 500MB, with limited memory keep this smaller
          writebackSizeLimit: 10MB


        # Zero out replica counts of other deployment modes
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0

        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        bloomCompactor:
          replicas: 0
        bloomGateway:
          replicas: 0
