apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-forward-auth
  namespace: argocd
spec:
  project: default

  destination:
    namespace: traefik-forward-auth
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

  source:
    path: manifests/infrastructure/manifests/traefik-forward-auth/
    repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
    targetRevision: argo
