apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default

  destination:
    namespace: external-dns
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

  sources:
    - chart: external-dns
      repoURL: https://kubernetes-sigs.github.io/external-dns/
      targetRevision: 1.21.1

      helm:
        releaseName: external-dns
        valuesObject:
          policy: sync

          domainFilters:
            - cluster.rebelinblue.com
          
          managedRecordTypes:
            - CNAME

          provider:
            name: linode

          sources: 
            - traefik-proxy
            - ingress
            - service

          resources:
            requests:
              cpu: 30m
              memory: 48Mi
            limits:
              cpu: 60m
              memory: 75Mi

          env:
            - name: LINODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: linode
                  key: LINODE_TOKEN

          serviceMonitor:
            enabled: true

    - path: manifests/infrastructure/manifests/external-dns/
      repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
      targetRevision: main
