apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default

  destination:
    namespace: external-dns
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

  sources:
    - chart: external-dns
      repoURL: https://kubernetes-sigs.github.io/external-dns/
      targetRevision: 1.12.1

      helm:
        releaseName: external-dns
        valuesObject:
          policy: sync

          domainFilters:
            - cluster.rebelinblue.com

          provider:
            name: linode

          logLevel: debug

          txtOwnerId: rpi-cluster-external-dns

          extraArgs:
            - --default-targets=dmzjrebqnjm.d.firewalla.org.

          env:
            - name: LINODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: linode
                  key: LINODE_TOKEN

          serviceMonitor:
            enabled: false

    - path: manifests/infrastructure/manifests/external-dns/
      repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
      targetRevision: argo
