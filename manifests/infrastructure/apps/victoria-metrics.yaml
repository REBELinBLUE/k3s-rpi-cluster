apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
spec:
  project: default

  destination:
    namespace: monitoring
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    ignoreDifferences:
      - kind: "Secret"
        jsonPointers:
          - /data/admin-password
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/template/metadata/annotations/checksum~1secret
    automated:
      prune: true
      selfHeal: true

  sources:
    - chart: victoria-metrics-k8s-stack
      repoURL: https://victoriametrics.github.io/helm-charts/
      targetRevision: 0.91.2

      helm:
        releaseName: vm

        valuesObject:
          argocdReleaseOverride: victoria-metrics

          vlagent:
            enabled: true
            spec:
              k8sCollector:
                enabled: true

          vlsingle:
            enabled: true
            spec:
              retentionPeriod: 30d
              storage:
                resources:
                  requests:
                    storage: 10Gi

          grafana:
            plugins:
              - victoriametrics-metrics-datasource
              - victoriametrics-logs-datasource

          defaultDashboards:
            annotations:
              argocd.argoproj.io/sync-options: ServerSideApply=true
