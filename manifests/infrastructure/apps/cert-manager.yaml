apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default

  destination:
    namespace: cert-manager
    name: in-cluster

  sources:
    - chart: cert-manager
      repoURL: https://charts.jetstack.io
      targetRevision: v1.6.1

      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/manifests/infrastructure/values/cert-manager.yaml

    - path: manifests/infrastructure/manifests/cert-manager/
      repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
      targetRevision: argo

    - repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
      targetRevision: argo
      ref: values

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
