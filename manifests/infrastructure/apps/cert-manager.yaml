apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default

  destination:
    namespace: cert-manager
    name: in-cluster

  source:
    - chart: cert-manager
      repoURL: https://charts.jetstack.io
      targetRevision: v1.6.1

      helm:
        releaseName: cert-manager

        valuesObject:
          installCRDs: true

          prometheus:
            enabled: true
            servicemonitor:
              enabled: true

    - path: manifests/infrastructure/manifests/cert-manager/
      repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
      targetRevision: argo

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
