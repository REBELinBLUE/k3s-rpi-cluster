apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default

  destination:
    namespace: logging
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

  sources:
    - chart: k8s-monitoring
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 3.6.2

      helm:
        releaseName: alloy

        valuesObject:
          cluster:
            name: k3s

          destinations:
            - name: loki
              type: loki
              url: http://loki-gateway.logs.svc.cluster.local/loki/api/v1/push

          clusterEvents:
            enabled: true
            collector: alloy-logs
            namespaces:
              - meta
              - prod

          nodeLogs:
            enabled: false

          prometheusOperatorObjects:
            enabled: true

          podLogs:
            enabled: true
            gatherMethod: kubernetesApi
            collector: alloy-logs
            labelsToKeep: [ "app_kubernetes_io_name","container","instance","job","level","namespace","service_name","service_namespace","deployment_environment","deployment_environment_name" ]
            structuredMetadata:
              pod: pod  # Set structured metadata "pod" from label "pod"
            namespaces:
              - meta
              - prod

          # Collectors
          alloy-singleton:
            enabled: false

          alloy-metrics:
            enabled: false

          alloy-logs:
            enabled: true
            alloy:
              mounts:
                varlog: false
                dockercontainers: false
              clustering:
                enabled: true

          alloy-profiles:
            enabled: false

          alloy-receiver:
            enabled: false
