apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: debugger
  namespace: argocd
spec:
  project: default

  destination:
    namespace: kube-system
    name: in-cluster

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  sources:
    - path: manifests/infrastructure/manifests/debugger/
      repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
      targetRevision: main

