apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default

  destination:
    namespace: kubeseal
    name: in-cluster

  source:
    chart: sealed-secrets
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    targetRevision: 2.17.9

    helm:
      releaseName: sealed-secrets

      valuesObject:
        ingress:
          enabled: false

        metrics:
          serviceMonitor:
            enabled: true
          dashboards:
            create: false

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
