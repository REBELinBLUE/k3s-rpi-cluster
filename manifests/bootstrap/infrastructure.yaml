apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd

spec:
  project: default

  destination:
    namespace: argocd
    name: in-cluster

  source:
    path: manifests/infrastructure/apps
    repoURL: https://github.com/REBELinBLUE/k3s-rpi-cluster
    targetRevision: main

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
