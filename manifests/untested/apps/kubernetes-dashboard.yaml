apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-dashboard
  namespace: argocd
spec:
  project: default

  destination:
    namespace: kubernetes-dashboard
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

  sources:
    - chart: kubernetes-dashboard
      repoURL: https://kubernetes.github.io/dashboard/
      targetRevision: 7.14.0

      helm:
        releaseName: kubernetes-dashboard

        valuesObject:
          cert-manager:
            enabled: false
          nginx:
            enabled: false
          metrics-server:
            enabled: false

          app:
            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - dashboard.cluster.rebelinblue.com
              issuer:
                name: letsencrypt-prod
                scope: cluster
              annotations:
                forecastle.stakater.com/expose: "true"
                forecastle.stakater.com/icon: https://raw.githubusercontent.com/stakater/ForecastleIcons/master/kubernetes.png
                forecastle.stakater.com/appName: Dashboard
                forecastle.stakater.com/group: Infrastructure
                traefik.ingress.kubernetes.io/router.middlewares: traefik-forward-auth@kubernetescrd
