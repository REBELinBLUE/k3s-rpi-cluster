{{- if and (eq .Values.group "infrastructure") (eq (include "cluster-apps.enabled" (dict "appName" "cert-manager-webhook-linode" "root" $)) "true") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-linode
  namespace: argocd
spec:
  project: default

  destination:
    namespace: cert-manager
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

  sources:
    - path: deploy/cert-manager-webhook-linode/
      repoURL: https://github.com/linode/cert-manager-webhook-linode
      targetRevision: v0.4.1

      helm:
        releaseName: cert-manager-webhook-linode

        valuesObject:
          api:
            groupName: cluster.rebelinblue.com

          image:
            repository: rebelinblue/cert-manager-webhook-linode

          resources:
            requests:
              cpu: 60m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 96Mi

    - path: manifests/infrastructure/manifests/cert-manager-webhook-linode/
      repoURL: {{ .Values.global.repoURL }}
      targetRevision: {{ .Values.global.targetRevision }}
{{- end }}
