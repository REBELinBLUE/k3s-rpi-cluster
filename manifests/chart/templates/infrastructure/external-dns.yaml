{{- if eq .Values.group "infrastructure" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default

  destination:
    namespace: external-dns
    name: in-cluster

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

  sources:
    - chart: external-dns
      repoURL: https://kubernetes-sigs.github.io/external-dns/
      targetRevision: 1.21.1

      helm:
        releaseName: external-dns
        valuesObject:
          policy: sync

          domainFilters:
            - cluster.rebelinblue.com

          managedRecordTypes:
            - CNAME

          provider:
            name: linode

          sources:
            - traefik-proxy
            - ingress
            - service

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi

          env:
            - name: LINODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: linode
                  key: LINODE_TOKEN

          serviceMonitor:
            enabled: true

    - path: manifests/infrastructure/manifests/external-dns/
      repoURL: {{ .Values.global.repoURL }}
      targetRevision: {{ .Values.global.targetRevision }}
{{- end }}
