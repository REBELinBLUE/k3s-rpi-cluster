{{- if eq .Values.group "bootstrap" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd

spec:
  project: default

  destination:
    namespace: argocd
    name: in-cluster

  source:
    path: manifests/chart
    repoURL: {{ .Values.global.repoURL }}
    targetRevision: {{ .Values.global.targetRevision }}
    helm:
      parameters:
        - name: group
          value: infrastructure

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
